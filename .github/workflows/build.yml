# Builds the firmware. Follows QMK's own userspace workflow
# (qmk/.github qmk_userspace_build.yml), plus cloning the keymap repositories
# listed in keymaps.txt, since they are not submodules.
#
# - Here: every push and pull request builds every target in qmk.json (the
#   shared users/nedsi code affects them all). Pushes to main also redraw the
#   shared layer diagrams in README.md and publish a release.
# - Keymap repositories call this workflow (workflow_call) with their own
#   repository and commit: only that keyboard is built, from that commit, and
#   on pushes its README layer diagrams are redrawn and a release published.
#
# Releases are tagged with the short commit SHA, so no tag ever moves; the
# newest one is always at https://github.com/<repo>/releases/latest.
name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      keymap_branch:
        description: "Branch to take from each keymap repository, when it has one (default branch otherwise)"
        default: ""
        required: false
        type: string
  workflow_call:
    inputs:
      keymap_repo:
        description: "Keymap repository to build, e.g. ned-si/scylla"
        required: true
        type: string
      keymap_ref:
        description: "Commit of that repository to build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    permissions:
      contents: write  # the diagram step pushes README updates to the keymap repository
    env:
      KEYMAP_REPO: ${{ inputs.keymap_repo }}
      KEYMAP_REF: ${{ inputs.keymap_ref }}
      # Branch to take from each keymap repository when it exists: the dispatch
      # input, or for pushes here the same branch name (so a userspace branch
      # builds the keymap branches of the same name).
      KEYMAP_BRANCH: ${{ inputs.keymap_branch || (github.repository == 'ned-si/qmk-userspace' && github.ref_name) || '' }}

    steps:
      - name: Checkout userspace
        uses: actions/checkout@v6
        with:
          repository: ned-si/qmk-userspace
          ref: ${{ github.repository == 'ned-si/qmk-userspace' && github.sha || 'main' }}

      - name: Checkout QMK Firmware
        uses: actions/checkout@v6
        with:
          path: qmk_firmware
          repository: qmk/qmk_firmware
          ref: master
          submodules: recursive

      - name: Install QMK CLI dependencies
        run: pip install -r qmk_firmware/requirements.txt

      - name: Configure QMK CLI
        run: |
          git config --global --add safe.directory '*'
          qmk config userspace_compile.parallel=$(nproc)
          qmk config user.qmk_home=$GITHUB_WORKSPACE/qmk_firmware
          qmk config user.overlay_dir=$GITHUB_WORKSPACE

      - name: Clone keymap repositories
        shell: bash
        run: |
          grep -v '^#' keymaps.txt | while read -r dir repo; do
            url="https://github.com/$repo.git"
            if [ "$repo" = "$KEYMAP_REPO" ]; then
              git clone --quiet "$url" "$dir"
              git -C "$dir" checkout --quiet "$KEYMAP_REF"
            elif [ -n "$KEYMAP_BRANCH" ] && git ls-remote --exit-code --heads "$url" "$KEYMAP_BRANCH" > /dev/null; then
              git clone --quiet --depth 1 --branch "$KEYMAP_BRANCH" "$url" "$dir"
            else
              git clone --quiet --depth 1 "$url" "$dir"
            fi
            echo "$repo: $(git -C "$dir" log -1 --format='%h %s')"
          done

      - name: Validate userspace
        run: qmk userspace-doctor

      - name: Build
        shell: bash
        run: |
          if [ -z "$KEYMAP_REPO" ]; then
            qmk userspace-compile --help | grep -q print-failures && extra=-p
            qmk userspace-compile -e DUMP_CI_METADATA=yes $extra || touch .failed
          else
            # Build only the targets that live in the calling repository's folder.
            dir=$(awk -v r="$KEYMAP_REPO" '!/^#/ && $2 == r { print $1 }' keymaps.txt)
            kb=${dir#keyboards/}; kb=${kb%/keymaps/nedsi}
            targets=$(python3 -c 'import json, sys; kb = sys.argv[1]; print("\n".join(t for t, _ in json.load(open("qmk.json"))["build_targets"] if t == kb or t.startswith(kb + "/")))' "$kb")
            [ -n "$targets" ] || { echo "No target in qmk.json for $KEYMAP_REPO ($kb)"; exit 1; }
            for t in $targets; do
              qmk compile -kb "$t" -km nedsi -e DUMP_CI_METADATA=yes || touch .failed
            done
          fi
          ./qmk_firmware/util/ci/generate_failure_markdown.sh > $GITHUB_STEP_SUMMARY || true
          truncate --size='<960K' $GITHUB_STEP_SUMMARY || true
          [ ! -f .failed ] || exit 1

      - name: Redraw layer diagrams
        # Keymap pushes only: redraw the README diagrams (util/layers.py) and
        # commit them back when they changed.
        if: inputs.keymap_repo != '' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=$(awk -v r="$KEYMAP_REPO" '!/^#/ && $2 == r { print $1 }' keymaps.txt)
          python3 util/layers.py "$dir"
          if git -C "$dir" diff --quiet -- README.md; then
            echo "Layer diagrams are up to date."
            exit 0
          fi
          git -C "$dir" -c user.name="github-actions[bot]" \
            -c user.email="41898583+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "docs: redraw layer diagrams" -- README.md
          git -C "$dir" push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${KEYMAP_REPO}.git" "HEAD:${GITHUB_REF_NAME}" \
            || echo "::warning::Could not push the redrawn diagrams (branch moved on?); they will be redrawn on the next push."

      - name: Redraw shared layer diagrams
        # Pushes to main here: redraw the shared layers in README.md
        # (util/layers.py users/nedsi) and commit them back when they changed.
        if: github.repository == 'ned-si/qmk-userspace' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python3 util/layers.py users/nedsi
          if git diff --quiet -- README.md; then
            echo "Shared layer diagrams are up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898583+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "docs: redraw shared layer diagrams" -- README.md
          git push --quiet origin HEAD:main \
            || echo "::warning::Could not push the redrawn diagrams (main moved on?); they will be redrawn on the next push."

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        if: always() && !cancelled()
        with:
          name: Firmware
          if-no-files-found: error
          path: |
            *.bin
            *.hex
            *.uf2

  publish:
    name: Publish
    needs: build
    # Keymap repositories only call this on pushes to their default branch;
    # here, only pushes to main publish.
    if: github.event_name == 'push' && (inputs.keymap_repo != '' || (github.repository == 'ned-si/qmk-userspace' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          name: Firmware
          path: firmware

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_SHA::7}
          notes="Built from ${GITHUB_SHA}. The newest firmware is always at https://github.com/${GITHUB_REPOSITORY}/releases/latest."
          gh release create "$tag" firmware/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Firmware $tag" --notes "$notes" --latest \
            || gh release upload "$tag" firmware/* --repo "$GITHUB_REPOSITORY" --clobber
